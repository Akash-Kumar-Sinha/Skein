[workspace]
members = ["crates/skein-peer", "crates/skein-store", "crates/skein-cli", "crates/skein-edl", "crates/skein-merge", "crates/skein-sync", "crates/skein-bench"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Akash Kumar Sinha"]

[workspace.dependencies]
kvdb = { git = "https://github.com/Akash-Kumar-Sinha/kvdb" }
iroh = "1.0.3"
iroh-blobs = { version = "0.103" , features = ["fs-store"] }
blake3 = "1.8.7"
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.12"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
futures-util = "0.3.34"
postcard = "1.1.3"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
proptest = "1.6.0"
criterion = { version = "0.5.1", features = ["html_reports", "async_tokio"] }
rand = "0.9.5"
hex = "0.4.3"
